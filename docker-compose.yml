services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chitra
      POSTGRES_USER: chitra
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["chitra_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  chitra_pg:
